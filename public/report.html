<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Отчет по производствени етапи</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
    }

    h1 { margin: 0; font-size: 18px; }

    a {
      color: #cbd5e1;
      font-size: 13px;
      text-decoration: none;
    }

    a:hover { color: white; text-decoration: underline; }

    main {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding: 20px;
    }

    form {
      display: flex;
      align-items: end;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid #374151;
    }

    label {
      display: grid;
      flex: 1;
      gap: 6px;
      color: #d1d5db;
      font-size: 13px;
    }

    input {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background: #111827;
      color: #f9fafb;
      font: inherit;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { cursor: wait; opacity: 0.55; }

    .status {
      min-height: 42px;
      padding: 12px 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    .status.error { color: #fca5a5; }

    .total-quantity {
      margin: 0 0 8px;
      color: #f9fafb;
      font-size: 15px;
      font-weight: 600;
    }

    .total-count {
      margin: 0 0 8px;
      color: #f9fafb;
      font-size: 15px;
      font-weight: 600;
    }

    #chart { width: 100%; height: min(70vh, 560px); min-height: 360px; }

    @media (max-width: 650px) {
      header { padding: 12px 14px; }
      main { padding: 14px; }
      form { align-items: stretch; flex-direction: column; }
      form button { width: 100%; }
      #chart { min-height: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Отчет по производствени етапи</h1>
    <a href="/">Към скенера</a>
  </header>

  <main>
    <form id="report-filter">
      <label for="batch-ids">
        ID на партида (може няколко, разделени със запетая или интервал)
        <input id="batch-ids" name="batch_id" inputmode="numeric" placeholder="60, 61" />
      </label>
      <button id="search-button" type="submit">Покажи</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Зареждане на отчета...</div>
    <p id="total-quantity" class="total-quantity" aria-live="polite"></p>
    <p id="total-count" class="total-count" aria-live="polite"></p>
    <div id="chart"></div>
  </main>

  <script>
    const form = document.getElementById('report-filter');
    const batchInput = document.getElementById('batch-ids');
    const searchButton = document.getElementById('search-button');
    const statusEl = document.getElementById('status');
    const totalQuantityEl = document.getElementById('total-quantity');
    const totalCountEl = document.getElementById('total-count');

    async function renderChart(batchIds = '') {
      statusEl.textContent = 'Зареждане на отчета...';
      statusEl.classList.remove('error');
      totalQuantityEl.textContent = '';
      totalCountEl.textContent = '';
      searchButton.disabled = true;
      const params = new URLSearchParams();
      if (batchIds) params.set('batch_id', batchIds);

      try {
        if (!window.Plotly) {
          throw new Error('Графиката не се зареди. Проверете интернет връзката.');
        }

        const response = await fetch(`/api/report${params.size ? `?${params}` : ''}`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Грешка при зареждане на отчета.');
        if (!Array.isArray(payload.data) || !payload.layout) {
          throw new Error('Получените данни за графиката са невалидни.');
        }

        await Plotly.newPlot('chart', payload.data, payload.layout, {
          responsive: true,
          displayModeBar: false,
        });
        totalQuantityEl.textContent = `Общо количество детайли: ${Number(payload.totalQuantity || 0).toLocaleString()}`;
        totalCountEl.textContent = `Общо количество видове детайли: ${Number(payload.totalCount || 0).toLocaleString()}`;
        const values = payload.data.flatMap((trace) => trace.y || []);
        statusEl.textContent = values.some((value) => Number(value) > 0)
          ? ''
          : 'Няма сканирания за избраните партиди.';
      } catch (error) {
        statusEl.textContent = error.message || 'Грешка при зареждане на отчета.';
        statusEl.classList.add('error');
      } finally {
        searchButton.disabled = false;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      renderChart(batchInput.value.trim());
    });

    const initialBatchIds = new URLSearchParams(window.location.search).get('batch_id') || '';
    batchInput.value = initialBatchIds;
    renderChart(initialBatchIds);
  </script>
</body>
</html>
